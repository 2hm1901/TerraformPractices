apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/2hm1901/TerraformPractices.git
    targetRevision: main
    path: week2/d1-gitops-cicd/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: d1-gitops
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
